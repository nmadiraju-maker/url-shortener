# URL shortener configuration. Copy to config/urlshort.toml and select it with:
#   URLSHORT_CONFIG=config/urlshort.toml
# Precedence: built-in defaults < this file < environment variables.
# Unknown sections or keys, wrong types and out-of-range values stop the service at startup.
# Secrets are NOT allowed here; set them in the environment:
#   URLSHORT_ADMIN_API_KEY   admin key for link takedown
#   URLSHORT_IP_SALT         secret used when hashing client IPs for analytics

[service]
base_url = "http://localhost:8000"   # public origin used to build short URLs; must be http(s)
db_path = "urlshort.db"              # SQLite file
code_length = 7                      # random short-code length, at least 4 (62^7 ~ 3.5e12 codes)
max_url_length = 2048
max_ttl_seconds = 31536000           # 1 year

[ratelimit]
# Per client (by IP for now). Rate is the steady pace; burst is how many requests may arrive
# back-to-back after a quiet period. Exceeding either returns 429 with Retry-After.
create_rate_per_minute = 60
create_burst = 10
redirect_rate_per_minute = 600       # high: protects against code scanning, not normal traffic
redirect_burst = 100
max_tracked_clients = 100000         # memory bound per limiter; idle clients are dropped first

[validation]
blocked_domains = []                 # e.g. ["evil.example"]; subdomains are blocked too
# Shortener domains rejected as targets. Replaces the built-in list when set.
# The service's own host (from base_url) is always rejected as well.
known_shorteners = ["bit.ly", "tinyurl.com", "t.co", "goo.gl", "ow.ly", "is.gd", "buff.ly", "rebrand.ly"]

[logging]
level = "INFO"                       # DEBUG, INFO, WARNING, ERROR or CRITICAL
# Extra field names to redact in logs. These ADD to the built-in list (authorization, api_key,
# password, secret, token, stats_token, client_ip, ip, email, cookie, ...); they never replace it.
redact_keys = []
request_sample_rate = 1.0            # share of successful request lines kept (0..1); errors always kept
