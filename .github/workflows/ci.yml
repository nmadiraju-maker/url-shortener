name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check urlshort sdlc tests

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy   # strict mode and target packages (urlshort, sdlc) are configured in pyproject.toml

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Bandit - service has no findings at any severity
        run: bandit -q -r urlshort
      - name: Bandit - orchestrator has no findings at medium severity or above
        # Low-severity B404/B603 remain by design: the orchestrator must run git (argument lists, no shell,
        # absolute executable path). Everything else is held to medium and above.
        run: bandit -q -r sdlc -ll
      - name: pip-audit - no known vulnerabilities in runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage
        run: >
          pytest -p no:cacheprovider
          --cov=urlshort --cov=sdlc --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
          --junitxml=junit.xml
      - name: 100% line and branch coverage - service
        run: coverage report --include="urlshort/*" --omit="urlshort/adapters/*" --fail-under=100   # adapters: infrastructure job
      - name: 100% line and branch coverage - orchestrator
        run: coverage report --include="sdlc/*" --fail-under=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  infrastructure:
    name: Infrastructure (Postgres + Redis adapters)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urlshort
          POSTGRES_PASSWORD: urlshort
          POSTGRES_DB: urlshort
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U urlshort" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      URLSHORT_TEST_DATABASE_URL: postgresql://urlshort:urlshort@localhost:5432/urlshort
      URLSHORT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Adapter tests against real Postgres and Redis
        run: pytest tests/infra --cov=urlshort --cov-branch -o addopts="" -q
      - name: 100% line and branch coverage - adapters
        run: coverage report --include="urlshort/adapters/*" --fail-under=100

  integration:
    name: Integration (Docker image + smoke test)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -t urlshort:ci .
      - name: Run the container
        run: >
          docker run -d --name urlshort -p 8000:8000
          -e URLSHORT_ADMIN_API_KEY=ci-only-key -e URLSHORT_IP_SALT=ci-only-salt
          urlshort:ci
      - name: Black-box smoke test against the container
        env:
          URLSHORT_ADMIN_API_KEY: ci-only-key
        run: ./scripts/smoke_test.sh http://localhost:8000
      - name: Container runs as a non-root user
        run: test "$(docker exec urlshort id -u)" != "0"
      - name: Production mode refuses an unsafe configuration
        run: |
          set +e
          docker run --rm -e URLSHORT_ENV=production urlshort:ci > refused.log 2>&1
          code=$?
          set -e
          cat refused.log
          test "$code" = 2 || { echo "::error::expected exit code 2, got $code"; exit 1; }
          grep -q '"refusing to start: invalid configuration"' refused.log
          test "$(grep -vc '^{' refused.log)" = 0 || { echo "::error::non-JSON output on refusal"; exit 1; }
      - name: Production mode starts with a safe configuration
        run: |
          docker run -d --name urlshort-prod -p 8001:8000 -e URLSHORT_ENV=production \
            -e URLSHORT_BASE_URL=https://sho.rt.example -e URLSHORT_EXPOSE_DOCS=false \
            -e URLSHORT_ADMIN_API_KEY=ci-only-admin-key-0123456789 -e URLSHORT_IP_SALT=ci-only-salt-0123456789 \
            -e URLSHORT_METRICS_TOKEN=ci-only-metrics-token-0123456 \
            urlshort:ci
          for i in $(seq 1 30); do curl -fs localhost:8001/readyz >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8001/livez)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8001/docs)" = 404
          curl -s -D - -o /dev/null localhost:8001/livez | grep -qi '^strict-transport-security:'
          docker logs urlshort-prod
      - name: Container logs
        if: always()
        run: docker logs urlshort

  scenarios:
    name: SDLC scenarios (orchestrator end to end)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # scenarios build on tagged baselines (v0.9.0, v0.10.0)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Baseline tags exist
        run: |
          for tag in v0.9.0 v0.10.0; do
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
              || { echo "::error::tag $tag is missing; push it with: git push origin $tag"; exit 1; }
          done
      - name: Greenfield - governance over a full build
        run: python -m sdlc.cli run scenarios/greenfield.json --approvals scenarios/approvals/greenfield.json --run-dir runs/greenfield
      - name: Brownfield - click caps with migration review, flawed drafts caught
        run: python -m sdlc.cli run scenarios/brownfield.json --approvals scenarios/approvals/brownfield.json --run-dir runs/brownfield
      - name: Ambiguous - clarification and mid-run re-plan
        run: python -m sdlc.cli run scenarios/ambiguous.json --approvals scenarios/approvals/ambiguous.json --run-dir runs/ambiguous
      - name: Ambiguous, interpreted by the LLM agent (replays the labelled cassette; no API key in CI)
        run: python -m sdlc.cli run scenarios/ambiguous-llm.json --approvals scenarios/approvals/ambiguous.json --run-dir runs/ambiguous-llm
      - name: Audit chains verify
        run: for run in greenfield brownfield ambiguous ambiguous-llm; do python -m sdlc.cli verify "runs/$run"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdlc-run-reports
          path: |
            runs/*/run-report.md
            runs/*/metrics.json
            runs/*/audit.jsonl
            runs/*/artifacts/
          retention-days: 30
