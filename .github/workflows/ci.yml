name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check urlshort tests

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy   # strict mode and target package are configured in pyproject.toml

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Bandit - no findings at any severity
        run: bandit -q -r urlshort
      - name: pip-audit - no known vulnerabilities in runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests with a 100% line and branch coverage gate
        run: >
          pytest -p no:cacheprovider
          --cov=urlshort --cov-branch --cov-fail-under=100
          --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
          --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  integration:
    name: Integration (Docker image + smoke test)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -t urlshort:ci .
      - name: Run the container
        run: docker run -d --name urlshort -p 8000:8000 urlshort:ci
      - name: Black-box smoke test against the container
        run: ./scripts/smoke_test.sh http://localhost:8000
      - name: Container runs as a non-root user
        run: test "$(docker exec urlshort id -u)" != "0"
      - name: Container logs
        if: always()
        run: docker logs urlshort
