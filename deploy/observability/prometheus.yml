# Scrape the service's /metrics with the bearer token (URLSHORT_METRICS_TOKEN), and load the alert rules.
global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: urlshort
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/urlshort_metrics_token
    static_configs:
      - targets: ["urlshort:8000"]
