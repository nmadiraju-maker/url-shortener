groups:
  - name: urlshort
    rules:
      - alert: UrlshortHighErrorRate
        expr: sum(rate(urlshort_http_requests_total{status=~"5.."}[5m])) / sum(rate(urlshort_http_requests_total[5m])) > 0.01
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 1% of requests fail with 5xx"
          runbook: "Check /readyz and the database; logs: filter level=ERROR, join on trace_id"
      - alert: UrlshortSlowRedirects
        expr: histogram_quantile(0.99, sum by (le) (rate(urlshort_http_request_duration_seconds_bucket{route="/{code}"}[5m]))) > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Redirect p99 above 50 ms (NFR-1)"
      - alert: UrlshortRateLimitSpike
        expr: sum by (limit) (rate(urlshort_rate_limited_total[5m])) > 5
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Sustained rate-limit refusals: abuse, or limits too low for real traffic"
      - alert: UrlshortEventBacklogGrowing
        expr: urlshort_event_outbox_backlog > 1000 and deriv(urlshort_event_outbox_backlog[10m]) > 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "Click events are not being published: is the relay worker running?"
      - alert: UrlshortRedirectsFailingOnStorage
        expr: sum(rate(urlshort_redirects_total{outcome="unavailable"}[5m])) > 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Capped links failing closed (503): storage unavailable"
