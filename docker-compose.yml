# Local infrastructure for the optional Postgres and Redis adapters.
#   docker compose up -d        then   make ci-infra
# Credentials here are for local development only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlshort
      POSTGRES_PASSWORD: urlshort
      POSTGRES_DB: urlshort
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshort"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
