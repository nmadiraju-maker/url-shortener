[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener service with analytics and reliability features"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.7", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["urlshort", "sdlc"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",   # interface declarations (stubs never execute)
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["urlshort", "sdlc"]

[tool.ruff.lint.isort]
known-first-party = ["urlshort", "sdlc"]   # explicit, so local and CI runs always agree on import grouping
